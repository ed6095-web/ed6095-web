<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90" viewBox="0 0 800 90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .bg  { fill: #0D1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width:1; rx:8; }
      .prompt { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size:14px; }
      .green  { fill: #3FB950; }
      .blue   { fill: #58A6FF; }
      .muted  { fill: #8B949E; }
      .white  { fill: #F0F6FC; }
      .yellow { fill: #d2991a; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes reveal { from{width:0} to{width:100%} }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
  </defs>

  <rect width="800" height="90" class="bg"/>

  <!-- Terminal chrome -->
  <rect x="0" y="0" width="800" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="800" height="28" rx="8" fill="#21262d"/>
  <rect x="0" y="20" width="800" height="8" fill="#21262d"/>
  <line x1="0" y1="28" x2="800" y2="28" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="18" cy="14" r="6" fill="#FF5F56"/>
  <circle cx="38" cy="14" r="6" fill="#FFBD2E"/>
  <circle cx="58" cy="14" r="6" fill="#27C93F"/>

  <!-- Title -->
  <text x="400" y="19" text-anchor="middle" class="prompt muted" font-size="12">ed6095-web@github: ~ — bash</text>

  <!-- Command line content -->
  <text x="16" y="52" class="prompt">
    <tspan class="green">ed6095-web</tspan>
    <tspan class="muted">@github</tspan>
    <tspan class="muted">:</tspan>
    <tspan class="blue">~</tspan>
    <tspan class="muted">$ </tspan>
    <tspan class="white">./run </tspan>
    <tspan class="yellow">--mode=</tspan>
    <tspan class="blue">engineer</tspan>
    <tspan class="white"> --focus=</tspan>
    <tspan class="green">backend</tspan>
    <tspan class="white"> --os=</tspan>
    <tspan class="blue">linux</tspan>
  </text>
  <text x="16" y="75" class="prompt">
    <tspan class="muted">[  </tspan>
    <tspan class="green">✓</tspan>
    <tspan class="muted">  ]  </tspan>
    <tspan class="white">Welcome,  </tspan>
    <tspan class="blue">Eashan Darsh</tspan>
    <tspan class="muted">  —  </tspan>
    <tspan class="green">Building systems that last.</tspan>
    <tspan class="white">  </tspan>
    <tspan class="green cursor">█</tspan>
  </text>
</svg>
