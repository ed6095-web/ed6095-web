<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="profileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#0D1520"/>
    </linearGradient>
    <linearGradient id="avatarRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#22C55E;#58A6FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#22C55E">
        <animate attributeName="stop-color" values="#22C55E;#58A6FF;#22C55E" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <filter id="pGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="profileClip">
      <rect width="900" height="200" rx="14"/>
    </clipPath>
    <clipPath id="avatarClip">
      <circle cx="100" cy="100" r="60"/>
    </clipPath>
  </defs>

  <g clip-path="url(#profileClip)">
    <rect width="900" height="200" fill="url(#profileBg)"/>

    <!-- Avatar ring glow -->
    <circle cx="100" cy="100" r="68" fill="none" stroke="url(#avatarRing)" stroke-width="3" filter="url(#pGlow)"/>
    <circle cx="100" cy="100" r="65" fill="none" stroke="url(#avatarRing)" stroke-width="1" opacity="0.5"/>

    <!-- Avatar placeholder circle (profile pic background) -->
    <circle cx="100" cy="100" r="60" fill="#161B22" clip-path="url(#avatarClip)"/>
    <!-- Stylized 'E' initial -->
    <text x="100" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" text-anchor="middle" filter="url(#pGlow)">E</text>

    <!-- Name and role -->
    <text x="200" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Eashan Darsh</text>
    <text x="200" y="108" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="url(#textGrad)" font-weight="600" letter-spacing="0.5">AI Engineer · Full Stack Developer · Computer Vision</text>
    <text x="200" y="132" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8B949E">SRM Institute of Science and Technology  ·  India 🇮🇳</text>

    <!-- Status badge -->
    <rect x="200" y="148" width="160" height="26" rx="13" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-width="0.8"/>
    <circle cx="218" cy="161" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="230" y="166" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#22C55E" font-weight="500">Open to Collaborate</text>
  </g>
  <rect width="900" height="200" rx="14" fill="none" stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.2"/>
</svg>
