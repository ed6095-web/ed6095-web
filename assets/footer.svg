<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#0D1520"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="footBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#58A6FF;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#22C55E;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:0"/>
    </linearGradient>
    <filter id="fGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="footClip">
      <rect width="900" height="80" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footClip)">
    <rect width="900" height="80" fill="url(#footBg)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="url(#footBorder)" stroke-width="1.5"/>

    <!-- Heart animation -->
    <text x="450" y="36" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8B949E" text-anchor="middle" letter-spacing="0.5">
      Made with
    </text>
    <text x="530" y="36" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#FF6B6B" text-anchor="middle" filter="url(#fGlow)">
      ❤️
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="36" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8B949E" text-anchor="middle" letter-spacing="0.5">
      by Eashan Darsh
    </text>

    <text x="450" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#58A6FF" text-anchor="middle" letter-spacing="2" opacity="0.7">
      AI ENGINEER  ·  FULL STACK DEVELOPER  ·  COMPUTER VISION
    </text>

    <!-- Side dots -->
    <circle cx="60" cy="40" r="3" fill="#22C55E" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="40" r="3" fill="#58A6FF" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect width="900" height="80" rx="12" fill="none" stroke="url(#footBorder)" stroke-width="1"/>
</svg>
