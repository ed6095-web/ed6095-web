<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161B22"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <linearGradient id="stackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect width="900" height="180" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="180" fill="url(#cardBg)"/>

    <!-- Top accent line (gradient) -->
    <rect x="0" y="0" width="900" height="3" fill="url(#accentLine)"/>

    <!-- Glass inner highlight -->
    <rect x="1" y="3" width="898" height="40" fill="#F8FAFC" fill-opacity="0.02"/>

    <!-- Project icon area -->
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#58A6FF" fill-opacity="0.1" stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="48" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" text-anchor="middle">🤖</text>

    <!-- Project Title -->
    <text x="88" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC" letter-spacing="-0.3">AI Expense Fraud Detection</text>
    <text x="88" y="64" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8B949E">AI-powered expense verification using OCR and fraud detection</text>

    <!-- Divider -->
    <line x1="24" y1="88" x2="876" y2="88" stroke="#30363D" stroke-width="0.8"/>

    <!-- Tech Stack chips -->
    <rect x="24" y="100" width="64" height="22" rx="11" fill="url(#stackGrad)" stroke="#58A6FF" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="56" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#58A6FF" text-anchor="middle" font-weight="500">Python</text>

    <rect x="96" y="100" width="50" height="22" rx="11" fill="url(#stackGrad)" stroke="#22C55E" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="121" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#22C55E" text-anchor="middle" font-weight="500">Flask</text>

    <rect x="154" y="100" width="42" height="22" rx="11" fill="url(#stackGrad)" stroke="#58A6FF" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="175" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#58A6FF" text-anchor="middle" font-weight="500">OCR</text>

    <rect x="204" y="100" width="32" height="22" rx="11" fill="url(#stackGrad)" stroke="#22C55E" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="220" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#22C55E" text-anchor="middle" font-weight="500">AI</text>

    <rect x="244" y="100" width="38" height="22" rx="11" fill="url(#stackGrad)" stroke="#58A6FF" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="263" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#58A6FF" text-anchor="middle" font-weight="500">SQL</text>

    <!-- Buttons -->
    <rect x="700" y="98" width="80" height="26" rx="13" fill="#58A6FF" fill-opacity="0.1" stroke="#58A6FF" stroke-width="0.8"/>
    <text x="740" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#58A6FF" text-anchor="middle" font-weight="500">View Code</text>

    <rect x="790" y="98" width="86" height="26" rx="13" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-width="0.8"/>
    <text x="833" y="115" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#22C55E" text-anchor="middle" font-weight="500">Live Demo →</text>

    <!-- Bottom stat line -->
    <text x="24" y="158" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8B949E">⭐ Featured Project  ·  🏗️ Production Ready  ·  👁️ AI-Powered</text>
  </g>

  <rect width="900" height="180" rx="14" fill="none" stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.2"/>
</svg>
